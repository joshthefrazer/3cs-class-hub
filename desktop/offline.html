<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>3CS Hub · offline</title>
<style>
  :root{ --bg:#F3F3F6; --ink:#1A1726; --ink3:#6F6A83; --brand:#5B2B8C; --card:#fff; --line:#E4E1EC; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#12111A; --ink:#F1EFF7; --ink3:#A7A2B8; --brand:#B08CE8; --card:#1B1926; --line:#2C2939; } }
  html,body{ height:100%; margin:0; }
  body{ display:grid; place-items:center; background:var(--bg); color:var(--ink); font:16px/1.5 "Segoe UI", system-ui, sans-serif; padding:24px; box-sizing:border-box; }
  .box{ max-width:440px; padding:32px; border-radius:22px; background:var(--card); border:1px solid var(--line); text-align:center; }
  h1{ font-size:1.5rem; margin:.4em 0 .3em; letter-spacing:-.02em; }
  p{ color:var(--ink3); margin:0 0 20px; }
  button{ font:inherit; font-weight:700; padding:11px 22px; border-radius:12px; border:0; background:var(--brand); color:#fff; cursor:pointer; }
  button:focus-visible{ outline:3px solid #2F66E0; outline-offset:2px; }
  small{ display:block; margin-top:16px; color:var(--ink3); font-size:.82rem; }
  .dot{ width:12px; height:12px; border-radius:50%; background:#E8641C; margin:0 auto; animation:p 1.6s ease-out infinite; }
  @keyframes p{ 0%{ box-shadow:0 0 0 0 rgba(232,100,28,.5); } 100%{ box-shadow:0 0 0 14px rgba(232,100,28,0); } }
</style>
</head>
<body>
  <div class="box" role="main">
    <div class="dot" aria-hidden="true"></div>
    <h1>Can't reach the Hub right now</h1>
    <p>This computer seems to be offline, or the school Wi-Fi is being slow. Once you've opened the Hub online once, the timetable works offline too.</p>
    <button id="retry" type="button">Try again</button>
    <small id="auto">Trying again automatically…</small>
  </div>
<script>
  var retry = function(){ if (window.hubDesktop && hubDesktop.retry) hubDesktop.retry(); else location.reload(); };
  document.getElementById("retry").addEventListener("click", retry);
  window.addEventListener("online", retry);
  setInterval(function(){ if (navigator.onLine) retry(); }, 20000);
</script>
</body>
</html>
